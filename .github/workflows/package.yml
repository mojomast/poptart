name: Self-contained Hermes package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build:check
      - run: npm test
      - run: pip install 'pytest>=8,<9' 'jsonschema>=4.23,<5' 'ruamel.yaml>=0.18,<0.19' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - run: python -m pytest -q tests/plugin
