manifest_version: 2
api_version: 1
name: hermes-strudel-studio
version: "0.2.4"
description: "Local Strudel studio. Lazily starts a loopback Node sidecar; saves tracks in profile plugin-data. Evaluated music runs only after user Play/apply in isolated frames, not an OS sandbox."
author: Hermes Strudel Studio contributors
license: AGPL-3.0-or-later
requires_hermes: ">=0.22.7"
provides_tools:
  - poptart_studio
python_dependencies:
  - "jsonschema>=4.23,<5"
